<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>プロブレム別デイリープレゼン (P-A/P)</title>
  <!-- Local CSS (Offline) -->
  <link rel="stylesheet" href="output.css">
  <!-- CDN (Online) - Comment out above and uncomment below to switch -->
  <!-- <script src="https://cdn.tailwindcss.com/3.4.16"></script> -->
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="textbook.css">
</head>

<body class="flex flex-col h-screen overflow-hidden text-slate-800 theme-problem">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-6 py-3 flex-none shadow-sm z-20">
    <div class="max-w-screen-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="スタート.html"
          class="flex items-center gap-1 text-slate-500 hover:text-indigo-600 mr-4 transition-colors font-bold text-sm"
          title="トップページへ戻る">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
          </svg>
          Home
        </a>
        <div class="bg-indigo-900 text-white p-2 rounded-lg font-bold text-lg leading-none">P-A/P</div>
        <div>
          <h1 class="text-lg font-bold">プロブレム別デイリーワークブック</h1>
          <p class="hidden sm:block text-[10px] text-slate-500 font-medium uppercase tracking-tighter">
            プロブレム毎のアセスメントとプランの提示</p>
        </div>
      </div>

      <div class="hidden lg:flex items-center gap-1" id="step-nav-bar">
        <!-- Navigation -->
      </div>

      <div class="flex items-center gap-3">
        <button onclick="downloadFullDraft()"
          class="bg-indigo-700 text-white px-3 sm:px-4 py-2 rounded-md text-sm font-bold hover:bg-indigo-800 transition-all flex items-center gap-2 shadow-sm">
          💾 <span class="hidden sm:inline">全原稿を出力</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main
    class="flex-1 flex flex-col lg:flex-row overflow-y-auto lg:overflow-hidden max-w-screen-2xl mx-auto w-full p-4 gap-4">

    <!-- Left Pane: Guidance -->
    <section class="w-full lg:w-1/2 flex flex-col gap-4 lg:overflow-y-auto lg:no-scrollbar pb-6 lg:min-h-0">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex-none">
        <div class="flex items-center justify-between mb-4">
          <span id="step-label"
            class="text-[10px] font-bold bg-indigo-100 text-indigo-700 px-2 py-1 rounded uppercase tracking-widest">Section
            1</span>
          <span id="step-time" class="text-xs text-slate-400 font-mono">15s</span>
        </div>
        <h2 id="step-title" class="text-2xl font-bold mb-2"></h2>
        <p id="step-rule" class="text-sm text-slate-600 leading-relaxed"></p>
      </div>

      <div class="bg-indigo-50/50 rounded-xl border border-indigo-100 p-6 flex-1 flex flex-col">
        <h3 class="text-xs font-bold text-indigo-800 uppercase tracking-widest mb-4 flex items-center gap-2">
          <span class="w-2 h-2 bg-indigo-500 rounded-full"></span> 77歳男性 経過プレゼンお手本 (Day 3)
        </h3>
        <div id="step-example"
          class="text-slate-900 leading-relaxed italic text-sm mb-6 border-l-4 border-indigo-300 pl-4 py-2 bg-white rounded shadow-sm">
          <!-- Example content -->
        </div>

        <h4 class="text-xs font-bold text-slate-500 mb-3 border-t border-indigo-100 pt-4 uppercase tracking-widest">
          記載のポイント</h4>
        <div id="step-tips" class="space-y-3">
          <!-- Tip list -->
        </div>
      </div>
    </section>

    <!-- Right Pane: Resident Input -->
    <section class="w-full lg:w-1/2 flex flex-col gap-4 min-h-[50vh] lg:min-h-0">
      <div class="bg-white rounded-xl shadow-lg border border-indigo-200 flex-1 flex flex-col overflow-hidden">
        <div class="p-4 bg-indigo-50 border-b border-indigo-100 flex items-center flex-none">
          <h3 class="text-xs font-bold text-indigo-800 uppercase tracking-widest">原稿入力欄</h3>
        </div>
        <textarea id="draft-input" oninput="saveDraft()"
          class="flex-1 p-6 text-base leading-relaxed text-slate-800 outline-none resize-none placeholder:text-slate-300"
          placeholder="担当症例の経過を入力"></textarea>

        <div id="step-nav" class="p-4 bg-slate-50 border-t border-slate-100 flex justify-between items-center flex-none">
          <button onclick="prevStep()" id="btn-prev"
            class="text-sm font-bold text-slate-400 hover:text-slate-800 disabled:opacity-30">← 前へ</button>
          <span id="char-count" class="text-[10px] text-slate-400 font-mono tracking-widest uppercase">0 chars</span>
          <button onclick="nextStep()" id="btn-next"
            class="bg-indigo-700 text-white px-6 py-2 rounded-lg text-sm font-bold hover:bg-indigo-800 transition-all shadow-sm">次へ
            →</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const steps = [
      {
        label: "Step 1", title: "Summary Update", time: "15s",
        rule: "主病名と入院日数を含め、現在の状態を短く述べる。",
        example: "「COPD急性増悪の疑いで入院3日目の77歳男性、佐藤さんです。ABC療法として、セフトリアキソン2g、mPSL40mgx3、ベネトリン吸入、低流量酸素を開始して、現在呼吸状態は安定しています。」",
        tips: ["既に共有した既往歴は繰り返さず、現在の状態に関わる情報を述べる。"],
        key: "ap_snap_step_1"
      },
      {
        label: "Step 2", title: "Subjective / Objective", time: "30s",
        rule: "前回の報告からの変化を述べる。夜間の経過、バイタルサイン、新しい検査結果とその評価を含める。",
        example: "「昨夜は咳嗽、呼吸困難が軽減し入眠できました。今朝より喀痰の粘稠度が低下し、呼吸困難感も消失しました。SpO2 92% (0.5L)と安定。血液検査でWBC 8500, CRP 2.4と炎症反応も改善傾向。喀痰のGram染色ではインフルエンザ桿菌と思われるグラム陰性桿菌がみられました。血糖は180〜210で推移。」",
        tips: ["検査値は前回の値と比較し、どのように変化したかを述べる。"],
        key: "ap_snap_step_2"
      },
      {
        label: "Step 3", title: "Problem #1: A & P", time: "45s",
        rule: "主な問題の評価と、本日の方針を述べる。処方の変更や離床の予定などを具体的に記載する。",
        example: "「#1 AE-COPDは、各種所見より改善傾向と判断します。本日より酸素をオフし、抗菌薬をCTRXから感受性が確認できればAMPC/CVAの内服に切り替えます。午後に理学療法士と離床範囲を拡大します。」",
        tips: ["継続する治療と変更する治療を分け、それぞれの理由を述べる。"],
        key: "ap_snap_step_3"
      },
      {
        label: "Step 4", title: "Problem #2: A & P", time: "30s",
        rule: "併存症や入院中に発生した問題（副作用等）への評価とプランを述べる。",
        example: "「#2 2型糖尿病は、ステロイドによる高血糖を認めるもののスライディングスケールで管理可能です。スライディングスケールを継続し、食事摂取が安定すれば内服再開を検討します。」",
        tips: ["併存症の経過と、対応が必要な問題を記載する。"],
        key: "ap_snap_step_4"
      },
      {
        label: "Step 5", title: "Social / Discharge", time: "15s",
        rule: "退院までに必要な対応と、患者・家族への説明予定を述べる。",
        example: "「病状は順調であり、週末の退院を目指します。本日、ご家族に今後の吸入指導と各種ワクチン接種、退院後の生活について説明する予定です。」",
        tips: ["退院後の生活を踏まえ、指導や支援の予定を記載する。"],
        key: "ap_snap_step_5"
      }
    ];

  </script>
  <script src="script.js"></script>
</body>

</html>
